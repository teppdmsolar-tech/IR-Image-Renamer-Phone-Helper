<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Field Log</title>
<meta name="description" content="An offline-first log for notes and photos." />

<!-- PWA metadata -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F2A24" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Field Log" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Field Log</span>
  </div>
  <span id="netStatus" class="status status--offline">offline</span>
</header>

<main>
  <section class="composer" aria-label="New entry">
    <textarea id="entryText" placeholder="What did you notice?" rows="3"></textarea>

    <div id="photoPreview" class="photo-preview" hidden>
      <img id="photoPreviewImg" alt="Selected photo preview" />
      <button id="removePhoto" type="button" class="icon-btn" aria-label="Remove photo">&times;</button>
    </div>

    <div class="composer-row">
      <label class="icon-btn" for="photoInput" aria-label="Add photo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="8.5" cy="10.5" r="1.5"/>
          <path d="M21 15l-4.5-4.5a2 2 0 0 0-2.8 0L5 19"/>
        </svg>
      </label>
      <input id="photoInput" type="file" accept="image/*" hidden />

      <button id="addEntry" class="btn-primary" type="button">Add entry</button>
    </div>
  </section>

  <section aria-label="Entries">
    <ul id="entryList" class="entry-list"></ul>
    <p id="emptyState" class="empty-state">No entries yet. Your first one will stay saved on this device, even offline.</p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
